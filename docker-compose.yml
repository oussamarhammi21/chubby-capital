services:
  arene:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data

  tableau:
    build: .
    command: ["chubby", "web", "--port", "8000"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
