<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'île des Chubbies</title>
<style>
:root { --ink: #1C2140; --muted: #5C6385; --line: rgba(28,33,64,0.09); --accent: #6C5CE7; --accent2: #8E7BFF; --cyan: #3CC8F0;
  --up: #12875A; --down: #D9534F; --warn: #E89A12; --live: #2BC48A; --glass: rgba(250,252,255,0.84); --navy: #13235A; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { overflow: hidden; font-family: Nunito, system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink); background: #0E2A4A; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.up { color: var(--up); } .down { color: var(--down); }

/* ---------- la scène : ton image, et tout ce qui vit dessus, dans les coordonnées de l'image (1548 × 1016) ---------- */
#stage { position: absolute; left: 0; top: 0; width: 1548px; height: 1016px; transform-origin: 0 0; }
#stage .bg { position: absolute; inset: 0; background: url('/static/img/ile.webp') 0 0 / 100% 100%; }
#flows { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.flow { fill: none; stroke-width: 5; stroke-dasharray: 12 9; stroke-linecap: round; animation: march 0.9s linear infinite; filter: drop-shadow(0 0 4px rgba(255,255,255,0.8)); }
@keyframes march { to { stroke-dashoffset: -21; } }
.flowtag rect { fill: #fff; stroke-width: 2.5; } .flowtag text { font: 800 15px Nunito, system-ui, sans-serif; }

/* les écrans peints, recouverts de vraies données */
.screen { position: absolute; color: #DDF3FF; font-weight: 800; overflow: hidden; }
#arena-chart { left: 549px; top: 166px; width: 172px; height: 145px; background: linear-gradient(180deg, #0B2B5E, #0A2150); border-radius: 4px; transform: skewY(-1.2deg); }
#arena-chart b { position: absolute; left: 8px; top: 5px; font-size: 10.5px; letter-spacing: 0.04em; color: #8FD0FF; text-transform: uppercase; }
#arena-list { left: 729px; top: 168px; width: 125px; height: 141px; background: #0C2556; border-radius: 3px; padding: 4px 6px; font-size: 12.5px; }
#arena-list div { display: flex; justify-content: space-between; gap: 4px; line-height: 22.5px; }
#arena-list div span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#arena-list div span:last-child { white-space: nowrap; flex: none; }
#arena-list .up { color: #4BE3A0; } #arena-list .down { color: #FF8C86; }
#indices { left: 1001px; top: 15px; width: 510px; height: 76px; background: linear-gradient(180deg, #1A2A66, #142154); border-radius: 14px; display: flex;
  align-items: center; gap: 4px; padding: 0 12px; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); }
#indices .when { flex: 1.25; line-height: 1.2; } #indices .when b { font: 700 17px Fredoka, Nunito, sans-serif; display: block; }
#indices .when span { font-size: 12.5px; color: #B8C4F0; }
#indices .ix { flex: 1; border-left: 1px solid rgba(255,255,255,0.15); padding-left: 10px; line-height: 1.25; }
#indices .ix small { display: block; font-size: 12px; color: #B8C4F0; } #indices .ix b { font-size: 17px; }
#indices .up { color: #5BE8A8; } #indices .down { color: #FF9590; }
.plate { position: absolute; transform: translate(-50%, -50%) rotate(-7deg); background: #182B63; color: #fff; border-radius: 6px; padding: 1px 6px;
  font: 800 12px Nunito, sans-serif; white-space: nowrap; box-shadow: 0 0 0 1.5px rgba(255,255,255,0.35); }
.plate i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #5BE8A8; margin-right: 4px; vertical-align: 1px; font-style: normal; }
.plate i.down { background: #FF9590; }

/* les Chubbies */
.bot { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; cursor: pointer;
  transition: left 2.2s cubic-bezier(.45,.05,.3,1), top 2.2s cubic-bezier(.45,.05,.3,1); z-index: 2; }
.bot .body { animation: bob 3.2s ease-in-out infinite; filter: drop-shadow(0 6px 6px rgba(0,0,0,0.25)); }
.bot.talk .body { animation: talk 0.5s ease-in-out infinite; }
.bot.sel .chip { background: var(--accent); color: #fff; } .bot.sel .chip .up, .bot.sel .chip .down { color: #fff; }
@keyframes bob { 50% { transform: translateY(-5px); } }
@keyframes talk { 50% { transform: translateY(-4px) scale(1.04, 0.97); } }
.chip { background: rgba(255,255,255,0.95); border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: 13px; box-shadow: 0 3px 10px rgba(0,0,0,0.2);
  white-space: nowrap; margin-bottom: 1px; }
.ring { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); pointer-events: none; }
.bubble { position: absolute; z-index: 5; width: max-content; max-width: 280px; transform: translate(-50%, -100%); background: #fff; border-radius: 18px; padding: 9px 13px;
  font-weight: 700; font-size: 15px; line-height: 1.35; box-shadow: 0 10px 26px rgba(0,0,0,0.25); animation: pop 0.25s ease-out; pointer-events: none; }
.bubble::after { content: ''; position: absolute; left: 50%; bottom: -8px; margin-left: -8px; border: 8px solid transparent; border-top-color: #fff; border-bottom: 0; }
@keyframes pop { from { transform: translate(-50%, -90%) scale(0.85); opacity: 0; } }
.zone { position: absolute; transform: translate(-50%, 0); background: rgba(19,35,90,0.78); color: #fff; font: 800 11.5px Nunito, sans-serif; letter-spacing: 0.04em;
  padding: 2px 9px; border-radius: 999px; text-transform: uppercase; opacity: 0; transition: opacity 0.4s; pointer-events: none; }
body.zones .zone { opacity: 1; }

/* ---------- les panneaux ---------- */
.glass { position: absolute; z-index: 10; background: var(--glass); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
  border: 1px solid rgba(255,255,255,0.85); border-radius: 22px; box-shadow: 0 14px 40px rgba(10,30,80,0.22); transition: opacity 0.3s, transform 0.3s; }
body.nopanels .hideable { opacity: 0; pointer-events: none; transform: translateY(8px); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 4px rgba(43,196,138,0.2); margin-right: 6px; }
.dot.off { background: #9AA0BC; box-shadow: none; }
h2 { margin: 0 0 8px; font: 700 16px Fredoka, Nunito, sans-serif; display: flex; align-items: center; justify-content: space-between; }
h3 { margin: 12px 0 6px; font-size: 11px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

.ctrl { right: 16px; top: 100px; padding: 5px; display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; max-width: 520px; }
.ctrl button, .ctrl select { padding: 7px 10px; border-radius: 13px; font-weight: 800; font-size: 13px; }
.ctrl button[aria-pressed="true"] { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
.ctrl select { border: 0; background: rgba(28,33,64,0.06); font: inherit; font-weight: 800; color: var(--ink); cursor: pointer; }

.feed { left: 16px; bottom: 16px; width: 318px; height: 214px; padding: 12px 10px 6px 14px; display: flex; flex-direction: column; transition: height 0.3s; }
body.feedopen .feed { height: calc(100% - 128px); z-index: 13; }
.feed .chips { display: none; } body.feedopen .feed .chips { display: flex; }
.iconbtn { padding: 3px 8px; border-radius: 9px; background: rgba(28,33,64,0.06); font-weight: 800; font-size: 12px; color: var(--muted); }
.chips { display: flex; gap: 4px; margin-bottom: 6px; flex-wrap: wrap; }
.chips button { font-size: 11.5px; font-weight: 800; padding: 4px 9px; border-radius: 999px; background: rgba(28,33,64,0.06); }
.chips button[aria-pressed="true"] { background: var(--ink); color: #fff; }
#feed { overflow-y: auto; flex: 1; padding-right: 4px; }
.ev { display: flex; gap: 9px; padding: 8px 2px; border-bottom: 1px solid var(--line); cursor: pointer; animation: fadein 0.4s; }
@keyframes fadein { from { opacity: 0; transform: translateY(-4px); } }
.ev:last-child { border-bottom: 0; }
.ev .b { flex: 1; min-width: 0; font-size: 12.5px; line-height: 1.38; font-weight: 600; color: #39406A; }
.ev .h { display: flex; justify-content: space-between; } .ev .h b { font: 700 13.5px Fredoka, Nunito, sans-serif; color: var(--ink); }
.ev time { font-size: 11px; font-weight: 800; color: var(--muted); }
.tag { display: inline-block; font-size: 10px; font-weight: 900; letter-spacing: 0.03em; padding: 1px 7px; border-radius: 999px; margin-right: 5px; vertical-align: 1px; }
.t-buy { background: rgba(18,135,90,0.13); color: var(--up); } .t-sell, .t-stop { background: rgba(217,83,79,0.13); color: var(--down); }
.t-seuil { background: rgba(232,154,18,0.16); color: #A86A00; } .t-learn { background: rgba(108,92,231,0.14); color: var(--accent); }
.t-plan { background: rgba(60,200,240,0.16); color: #1C7FA6; } .t-idee { background: rgba(28,33,64,0.07); color: var(--muted); }
.empty { color: var(--muted); font-weight: 700; font-size: 13px; padding: 12px 2px; }

.ranks { right: 16px; bottom: 16px; width: 318px; height: 214px; padding: 10px 10px 6px 12px; display: flex; flex-direction: column; }
#rank-body { overflow-y: auto; flex: 1; }
.rank { display: grid; grid-template-columns: 14px 24px 1fr 54px 52px; gap: 5px; align-items: center; padding: 2px 4px; border-radius: 9px; cursor: pointer; font-weight: 800; font-size: 12.5px; }
.rank:hover, .rank.sel { background: rgba(108,92,231,0.1); } .rank .n { color: var(--muted); font-size: 11px; text-align: right; }
.rank small { color: var(--muted); font-weight: 700; font-size: 10.5px; margin-left: 4px; }
.rank .v { text-align: right; }
.fiche { top: 150px; bottom: 16px; width: 360px; right: 16px; padding: 14px; display: none; flex-direction: column; z-index: 14; }
.fiche.left { right: auto; left: 16px; } body.fiche-open .fiche { display: flex; animation: slidein 0.3s ease-out; }
@keyframes slidein { from { opacity: 0; transform: translateY(10px); } }
#fiche-body { overflow-y: auto; flex: 1; padding-right: 3px; }
.who { display: flex; gap: 10px; align-items: center; }
.who b { font: 700 20px Fredoka, Nunito, sans-serif; display: block; } .who small { color: var(--muted); font-weight: 700; font-size: 12.5px; display: block; }
.who button { margin-left: auto; align-self: flex-start; padding: 6px 10px; border-radius: 10px; background: rgba(28,33,64,0.06); font-weight: 800; font-size: 12px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.kpis div { background: rgba(255,255,255,0.7); border-radius: 12px; padding: 7px 9px; }
.kpis small { display: block; font-size: 10px; font-weight: 900; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.kpis b { font: 700 16px Fredoka, Nunito, sans-serif; }
.watch { display: grid; grid-template-columns: 62px 1fr; gap: 3px 8px; font-size: 12.5px; font-weight: 700; align-items: center; margin-bottom: 8px; }
.watch .tk { font: 700 13px Fredoka, Nunito, sans-serif; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.watch small { grid-column: 2; color: var(--muted); font-size: 11.5px; font-weight: 700; line-height: 1.3; }
.gauge { height: 7px; border-radius: 4px; background: rgba(28,33,64,0.1); overflow: hidden; } .gauge i { display: block; height: 100%; border-radius: 4px; transition: width 0.6s; }
.day { display: grid; grid-template-columns: 66px 1fr; gap: 4px 8px; font-size: 12.5px; font-weight: 600; line-height: 1.35; }
.day small { color: var(--muted); font-weight: 800; font-size: 11.5px; padding-top: 1px; }
.note { font-size: 12px; font-weight: 700; color: #39406A; margin-top: 4px; line-height: 1.4; }
.more { display: block; margin-top: 12px; text-align: center; padding: 9px; border-radius: 12px; background: rgba(108,92,231,0.1); color: var(--accent); font-weight: 800; font-size: 13px; text-decoration: none; }

.timeline { left: 348px; right: 348px; bottom: 16px; padding: 8px 14px 8px 8px; display: flex; align-items: center; gap: 10px; border-radius: 999px; }
.play { width: 44px; height: 44px; flex: none; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-weight: 800; box-shadow: 0 6px 16px rgba(108,92,231,0.35); }
.seg { display: flex; background: rgba(28,33,64,0.06); border-radius: 12px; padding: 3px; flex: none; }
.seg button { padding: 7px 10px; border-radius: 9px; font-weight: 800; font-size: 12.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
.track { flex: 1; position: relative; height: 40px; min-width: 120px; cursor: pointer; touch-action: none; }
.track .bar { position: absolute; left: 0; right: 0; top: 22px; height: 5px; border-radius: 3px; background: rgba(28,33,64,0.12); }
.track .fill { position: absolute; left: 0; top: 22px; height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--cyan)); }
.track .mk { position: absolute; top: 5px; width: 4px; margin-left: -2px; height: 11px; border-radius: 2px; }
.track .knob { position: absolute; top: 17px; width: 15px; height: 15px; margin-left: -7.5px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
.track .lab { position: absolute; top: -2px; transform: translateX(-50%); font-size: 11px; font-weight: 900; color: var(--accent); white-space: nowrap; }
.legend { font-size: 11px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.legend b { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin: 0 3px 0 7px; }
.toast { left: 50%; top: 150px; transform: translateX(-50%); padding: 9px 16px; font-weight: 800; font-size: 13px; display: none; }

@media (max-width: 1300px) { .legend { display: none; } .seg.speed { display: none; } }
@media (max-width: 1080px) { .timeline { left: 16px; right: 16px; bottom: 242px; } }
@media (max-width: 900px) {
  .feed, .ranks { display: none; } body.showfeed .feed { display: flex; height: 45vh; bottom: 84px; left: 10px; right: 10px; width: auto; z-index: 12; }
  body.showfeed .feed .chips { display: flex; }
  .fiche, .fiche.left { left: 10px; right: 10px; width: auto; top: auto; height: 50vh; bottom: 84px; }
  .timeline { left: 10px; right: 10px; bottom: 10px; } .timeline .seg.speed { display: none; }
  .ctrl { top: 70px; right: 10px; left: 10px; max-width: none; justify-content: center; display: none; } body.showctrl .ctrl { display: flex; }
  .timeline { gap: 6px; padding-right: 8px; } .seg button { padding: 6px 7px; } .track { min-width: 60px; } .play { width: 38px; height: 38px; }
  .bubble { max-width: 220px; font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) { .bot .body, .bot.talk .body, .flow { animation: none; } .bot { transition: none; } }
</style>
</head>
<body>
<div id="stage">
  <div class="bg" role="img" aria-label="L'île des Chubbies : l'arène au centre, la maison des Chubbies à gauche, le marché à droite, le coach en bas"></div>
  <div class="screen" id="indices"></div>
  <div class="screen" id="arena-chart"><b>L'arène aujourd'hui</b><svg id="arena-svg" viewBox="0 0 172 145" width="172" height="145"></svg></div>
  <div class="screen" id="arena-list"></div>
  <div id="plates"></div>
  <div id="zones"></div>
  <svg id="flows" viewBox="0 0 1548 1016"></svg>
  <div id="bots"></div>
  <div id="bubbles"></div>
</div>

<div class="glass ctrl hideable" role="toolbar" aria-label="Son et affichage">
  <button id="b-sound" aria-pressed="false">🔇 Son</button>
  <select id="s-voice" aria-label="Voix des Chubbies">
    <option value="humaine">🗣 Voix humaines</option><option value="mignonne">🐣 Voix mignonnes</option><option value="muette">🤐 Muets</option>
  </select>
  <button id="b-music" aria-pressed="false">🎵 Musique</button>
  <button id="b-team" aria-pressed="false" title="Montrer les versions coachées par Claude">🤖 Versions IA</button>
  <button id="b-zones" aria-pressed="false">🗺 Lieux</button>
  <button id="b-panels" aria-pressed="true">▤ Panneaux</button>
  <a href="/" class="btn" style="padding:8px 11px;font-weight:800;font-size:13px;color:inherit;text-decoration:none">← Tableau</a>
</div>
<div class="glass toast" id="toast"></div>

<section class="glass feed hideable" aria-label="Ce qui se passe">
  <h2><span><span class="dot" id="feed-dot"></span>Ce qui se passe</span><button class="iconbtn" id="feed-more" aria-expanded="false">Tout voir ⤢</button></h2>
  <div class="chips" id="filters">
    <button aria-pressed="true" data-f="tout">Tout</button><button aria-pressed="false" data-f="trade">Trades</button>
    <button aria-pressed="false" data-f="seuil">Seuils</button><button aria-pressed="false" data-f="plan">Plans</button><button aria-pressed="false" data-f="learn">Apprentissage</button>
  </div>
  <div id="feed" aria-live="polite"></div>
</section>

<section class="glass ranks hideable" aria-label="Classement">
  <h2><span>🏆 Classement</span><small id="rank-sub" style="font:700 11px Nunito,sans-serif;color:var(--muted)"></small></h2>
  <div id="rank-body"></div>
</section>
<aside class="glass fiche" id="fiche" aria-label="Fiche du Chubby">
  <div id="fiche-body"></div>
</aside>

<div class="glass timeline">
  <button class="play" id="play" aria-label="Lecture">▶</button>
  <div class="seg" id="modes"><button aria-pressed="true" data-m="live">● Aujourd'hui</button><button aria-pressed="false" data-m="replay">Saison</button></div>
  <div class="seg speed" id="speeds"><button aria-pressed="true" data-s="1">×1</button><button aria-pressed="false" data-s="4">×4</button><button aria-pressed="false" data-s="12">×12</button></div>
  <div class="track" id="track" role="slider" aria-label="Moment affiché" tabindex="0"><div class="bar"></div><div class="fill"></div><div id="marks"></div><div class="knob"></div><div class="lab"></div></div>
  <div class="legend" id="legend"></div>
  <button id="b-more" style="display:none;font-weight:800;font-size:13px;padding:8px">☰</button>
</div>

<script src="/static/chubbies.js"></script>
<script src="/static/sons.js"></script>
<script>
(function () {
  'use strict';
  var C = window.Chubby, S = window.Sons, esc = C.esc, NS = 'http://www.w3.org/2000/svg';
  function $(s) { return document.querySelector(s); }
  function pct(v, d) { return v == null ? '—' : C.pct(v, d); }
  function frNum(v, d) { return Number(v).toLocaleString('fr-CA', { minimumFractionDigits: d == null ? 2 : d, maximumFractionDigits: d == null ? 2 : d }); }

  // ---------- la scène suit la fenêtre : l'image couvre l'écran, sans jamais être déformée ----------
  // Sur un écran étroit (téléphone), l'île déborde sur les côtés : on la fait glisser du doigt.
  var W = 1548, H = 1016, stage = $('#stage'), panX = 0, scale = 1, offX = 0;
  function fit() {
    var vw = innerWidth, vh = innerHeight, k = scale = Math.max(vw / W, vh / H);
    var room = W * k - vw; panX = Math.max(-room / 2, Math.min(room / 2, panX));
    var x = offX = -room / 2 + panX, y = 0; // on garde le haut (le logo, les indices) et on rogne le bas
    stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + k + ')';
  }
  addEventListener('resize', fit); fit();
  var pan = null;
  stage.addEventListener('pointerdown', function (e) { if (!e.target.closest('.bot')) pan = { x: e.clientX, start: panX }; });
  addEventListener('pointermove', function (e) { if (pan) { panX = pan.start + (e.clientX - pan.x); fit(); } });
  addEventListener('pointerup', function () { pan = null; });
  function centerOn(ix) { panX = (W / 2 - ix) * scale; fit(); } // amène un point de l'image au centre de l'écran

  // ---------- les lieux de l'île : où va un Chubby selon ce qu'il est en train de faire ----------
  var MARKET = [1222, 300]; // l'enseigne « Le Marché »
  // Les emplacements sont espacés d'au moins 115 px pour que les étiquettes ne se chevauchent pas ; un lieu plein
  // envoie les suivants au lieu voisin (fallback).
  var ZONES = {
    marche: { label: 'Au marché : il agit', at: [1250, 462], fallback: 'place', slots: [[1135, 438], [1250, 446], [1365, 438]] },
    place:  { label: 'Sur la place : un seuil approche', at: [740, 715], fallback: 'maison', slots: [[590, 575], [890, 575], [660, 662], [820, 662]] },
    maison: { label: 'À la maison : il surveille', at: [300, 395], fallback: 'place', slots: [[175, 600], [290, 600], [405, 600], [380, 700], [495, 700]] },
    salon:  { label: 'Au salon : tout au cash', at: [1400, 660], fallback: 'place', slots: [[1250, 612], [1405, 632], [1330, 540]] },
    coach:  { label: 'Chez le coach', at: [925, 660], fallback: 'place', slots: [[860, 762], [975, 780]] }
  };
  $('#zones').innerHTML = Object.keys(ZONES).map(function (k) {
    var z = ZONES[k]; return '<div class="zone" style="left:' + z.at[0] + 'px;top:' + z.at[1] + 'px">' + esc(z.label) + '</div>';
  }).join('');
  // Les plaques peintes de la maison des Chubbies, avec les vrais noms (et un point vert/rouge selon leur journée).
  var PLATES = [['tortue', 136, 494], ['flan', 201, 485], ['dumpling', 270, 475], ['mochi', 330, 465], ['muffin', 381, 458], ['jalapeno', 428, 452], ['matcha', 470, 445]];

  // ---------- état ----------
  var live = null, replay = null, fiches = {}, mode = 'live', team = 'orig', sel = null, filter = 'tout';
  var cursor = 0, playing = false, speed = 1, lastSpokenAt = 0, feedItems = [], bubbleTimer = null, talkQueue = [];
  var bots = {}; // id -> { el, zone, slot }

  // ---------- le fil « Ce qui se passe » ----------

    if (mode === 'replay' && replay) { var j = (replay.journal[replay.days[cursor]] || {})[b]; if (j) h += '<small>Ce soir-là</small><div>' + esc(j) + '</div>'; }
    h += '</div>';
    // Ce qu'il apprend : sa version coachée par Claude contre l'original, sur la saison.
    h += '<h3>Ce qu\'il apprend</h3>' + learning(b);
    h += '<a class="more" href="/chubby?id=' + encodeURIComponent(b) + '">Toute sa fiche, chaque trade expliqué →</a>';
    $('#fiche-body').innerHTML = h;
    $('#close').onclick = function () { sel = null; document.body.classList.remove('fiche-open'); render(); };
    $('#hear').onclick = function () {
      if (!S.sound) setSoundBtn(S.setSound(true));
      say(b, lb ? (lb.reaction || (lb.thoughts || [])[0] || 'Rien à signaler.') : 'Bonjour, je suis ' + name + ' !', true);
    };
  }
  function learning(id) {
    if (!replay) return '<div class="note">Chargement…</div>';
    var o = C.isAI(id) ? id.replace(/-ia$/, '') : id, ia = o + '-ia', a = replay.equity[o], c = replay.equity[ia];
    if (!a || !c) return '<div class="note">Pas de version coachée pour ce Chubby.</div>';
    var n = a.length, from = Math.max(0, n - 60), A = [], B = [];
    for (var i = from; i < n; i++) { A.push(a[i] / replay.starting_cash - 1); B.push(c[i] / replay.starting_cash - 1); }
    var lo = Math.min.apply(null, A.concat(B)), hi = Math.max.apply(null, A.concat(B)), sp = hi - lo || 1;
    function path(v) { return v.map(function (y, i) { return (i ? 'L' : 'M') + (6 + i * 290 / (v.length - 1)).toFixed(1) + ' ' + (8 + 58 * (1 - (y - lo) / sp)).toFixed(1); }).join(''); }
    var coachDays = [], lesson = null;
    for (var k = from; k < n; k++) (replay.events[replay.days[k]] || []).forEach(function (e) {
      if (e.bot_id === ia && e.kind === 'ai_coach') { coachDays.push(k - from); lesson = e; lesson.day = replay.days[k]; }
    });
    var gap = (B[B.length - 1] - A[A.length - 1]) * 100;
    var svg = '<svg viewBox="0 0 310 74" width="100%" height="74">' + coachDays.map(function (k) { var x = 6 + k * 290 / (A.length - 1); return '<line x1="' + x + '" x2="' + x + '" y1="4" y2="70" stroke="#3CC8F0" stroke-dasharray="3 3"/>'; }).join('') +
      '<path d="' + path(A) + '" fill="none" stroke="#E0956E" stroke-width="3" stroke-linecap="round"/>' +
      '<path d="' + path(B) + '" fill="none" stroke="#6C5CE7" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/></svg>';
    return svg + '<div class="note"><span style="color:#E0956E">━ original</span> · <span style="color:#6C5CE7">┅ version IA</span>' + (coachDays.length ? ' · <span style="color:#1C7FA6">┊ coaching</span>' : '') + '<br>' +
      (lesson ? 'Le ' + esc(new Date(lesson.day + 'T12:00:00').toLocaleDateString('fr-CA', { day: 'numeric', month: 'long' })) + ', Claude : « ' + esc(lesson.lesson) + ' »<br>' : 'Claude ne l\'a pas encore coaché sur cette période.<br>') +
      'Écart sur 60 jours : <b class="' + C.cls(gap) + '">' + (gap >= 0 ? '+' : '−') + Math.abs(gap).toFixed(1).replace('.', ',') + ' points</b> pour la version IA.</div>';
  }
  function drawRank() {
    var list = shown().slice();
    if (mode === 'replay') list.sort(function (a, b) { return b.total - a.total; });
    else list.sort(function (a, b) { return (fiches[a.id] ? fiches[a.id].rank : 99) - (fiches[b.id] ? fiches[b.id].rank : 99) || b.change - a.change; });
    $('#rank-sub').textContent = mode === 'live' ? "leur journée" : 'leur saison';
    $('#rank-body').innerHTML = list.map(function (s, i) {
        var curve = mode === 'live' ? (s.bot.curve || []).slice(0, cursor + 1)
          : (replay.equity[s.id] || []).slice(0, cursor + 1).map(function (v) { return v == null ? 0 : v / replay.starting_cash - 1; });
        var v = mode === 'replay' ? s.total : s.change;
        return '<div class="rank' + (s.id === sel ? ' sel' : '') + '" data-id="' + esc(s.id) + '"><span class="n">' + (i + 1) + '</span>' + C.avatar(s.id, s.mood, 24) + '<span>' + esc(s.name) +
          '</span><svg width="54" height="20" viewBox="0 0 54 20">' + spark(curve, 54, 20, 2, v >= 0 ? '#12875A' : '#D9534F') + '</svg>' +
          '<span class="v ' + C.cls(v) + '">' + pct(v) + '</span></div>';
      }).join('');
  }
  $('#rank-body').addEventListener('click', function (e) { var r = e.target.closest('.rank'); if (r) select(r.dataset.id, true); });
  function select(id, speak) {
    sel = id; document.body.classList.add('fiche-open');
    Object.keys(bots).forEach(function (k) { bots[k].el.classList.toggle('sel', k === id); });
    // La fiche s'ouvre du côté opposé au Chubby, pour qu'on le voie toujours parler.
    var o = bots[id]; // sa place d'arrivée, même s'il est encore en train de marcher
    $('#fiche').classList.toggle('left', !!o && o.x * scale + offX > innerWidth / 2);
    if (o && innerWidth <= 900) centerOn(o.x);
    drawSide();
    if (!fiches[id]) fetch('/api/bots/' + encodeURIComponent(id) + '/fiche').then(function (r) { return r.json(); }).then(function (f) { if (!f.erreur) { fiches[id] = f; if (sel === id) drawSide(); } });
    if (speak) {
      var s = shown().filter(function (x) { return x.id === id; })[0];
      var text = s && (mode === 'live' ? s.bot.reaction || (s.bot.thoughts || [])[0] : (replay.journal[replay.days[cursor]] || {})[id]);
      S.sfx('pop'); if (text) say(id, text, true);
    }
  }

  // ---------- la frise du bas : la séance (5 min par pas) ou la saison (un jour par pas) ----------
  var COLORS = { trade: '#12875A', stop: '#D9534F', learn: '#6C5CE7', seuil: '#E89A12' };
  function length() { return mode === 'live' ? (live ? live.times.length : 1) : (replay ? replay.days.length : 1); }
  function drawTrack() {
    var n = length(), p = n > 1 ? cursor / (n - 1) * 100 : 100;
    $('#track .fill').style.width = p + '%'; $('#track .knob').style.left = p + '%';
    var lab = mode === 'live' ? (live && live.times[cursor] || '').replace(':', ' h ') : replay ? new Date(replay.days[cursor] + 'T12:00:00').toLocaleDateString('fr-CA', { day: 'numeric', month: 'short' }) : '';
    $('#track .lab').style.left = p + '%'; $('#track .lab').textContent = lab;
    $('#track').setAttribute('aria-valuetext', lab);
    var marks = '';
    if (mode === 'replay' && replay) replay.days.forEach(function (d, i) {
      var ids = {}; originalIds(replay.bots).forEach(function (b) { ids[b.id] = 1; });
      var ev = (replay.events[d] || []).filter(function (e) { return ids[e.bot_id] || e.kind === 'ai_coach'; }), k = null;
      if (ev.some(function (e) { return e.kind === 'ai_coach' || e.kind === 'coach'; })) k = 'learn';
      else if (ev.some(function (e) { return e.kind === 'stop'; })) k = 'stop';
      else if (ev.filter(function (e) { return e.kind === 'trade'; }).length >= 3) k = 'trade';
      if (k) marks += '<i class="mk" style="left:' + (i / (n - 1) * 100) + '%;background:' + COLORS[k] + '"></i>';
    });
    $('#marks').innerHTML = marks;
    $('#legend').innerHTML = mode === 'replay' ? '<b style="background:#12875A"></b>trades<b style="background:#D9534F"></b>stops<b style="background:#6C5CE7"></b>coaching' : '9 h 30 → ' + (live && live.as_of ? live.as_of.replace(':', ' h ') : '16 h');
  }
  function seek(e) {
    var r = $('#track').getBoundingClientRect(), n = length();
    cursor = Math.round(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (n - 1)); render();
  }
  var dragging = false;
  $('#track').addEventListener('pointerdown', function (e) { dragging = true; $('#track').setPointerCapture(e.pointerId); seek(e); });
  $('#track').addEventListener('pointermove', function (e) { if (dragging) seek(e); });
  $('#track').addEventListener('pointerup', function () { dragging = false; });
  $('#track').addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { cursor = Math.max(0, Math.min(length() - 1, cursor + (e.key === 'ArrowRight' ? 1 : -1))); render(); e.preventDefault(); }
  });
  $('#play').onclick = function () {
    playing = !playing; if (playing && cursor >= length() - 1) cursor = 0;
    $('#play').textContent = playing ? '❚❚' : '▶'; $('#play').setAttribute('aria-label', playing ? 'Pause' : 'Lecture');
  };
  $('#speeds').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return; speed = +b.dataset.s;
    [].forEach.call($('#speeds').children, function (x) { x.setAttribute('aria-pressed', String(x === b)); });
  };
  $('#modes').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return; setMode(b.dataset.m);
  };
  function setMode(m) {
    mode = m; [].forEach.call($('#modes').children, function (x) { x.setAttribute('aria-pressed', String(x.dataset.m === m)); });
    cursor = length() - 1; talkQueue = []; S.setTempo(m === 'live' && live && live.open ? 78 : 70); render();
  }
  var acc = 0, lastT = 0;
  function tick(t) {
    if (playing && lastT) {
      acc += (t - lastT) / 1000 * speed;
      var step = mode === 'live' ? 1.2 : 1.6; // secondes par pas à ×1
      if (acc > step) {
        acc = 0; if (cursor < length() - 1) { cursor++; render(); onStep(); }
        else { playing = false; $('#play').textContent = '▶'; }
      }
    }
    lastT = t; requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  function onStep() { // en rejouant, un petit son à chaque trade et le Chubby concerné dit son plan
    if (mode !== 'replay' || !replay) return;
    var ids = {}; originalIds(replay.bots).forEach(function (b) { ids[b.id] = 1; });
    var ev = (replay.events[replay.days[cursor]] || []).filter(function (e) { return ids[e.bot_id]; });
    if (ev.some(function (e) { return e.kind === 'stop'; })) S.sfx('oops'); else if (ev.some(function (e) { return e.kind === 'trade'; })) S.sfx('trade');
    if (ev.some(function (e) { return e.kind === 'ai_coach'; })) S.sfx('learn');
    if (speed <= 4 && !S.busy()) { var e = ev[0], j = e && (replay.journal[replay.days[cursor]] || {})[e.bot_id]; if (j) say(e.bot_id, j, false); }
  }

  // ---------- tout redessiner ----------
  function render() {
    var list = shown();
    place(list); flows(list); screens(); drawTrack(); buildFeed(); drawSide();
  }

  // ---------- boutons ----------
  function setSoundBtn(on) { $('#b-sound').setAttribute('aria-pressed', String(on)); $('#b-sound').textContent = (on ? '🔊' : '🔇') + ' Son'; }
  $('#b-sound').onclick = function () { var on = S.setSound(!S.sound); setSoundBtn(on); if (on) toast(S.voice === 'humaine' ? 'Clique sur un Chubby pour l\'entendre.' : 'Son activé.'); };
  $('#s-voice').value = S.voice; if (!S.humanAvailable()) $('#s-voice').querySelector('[value=humaine]').disabled = true;
  $('#s-voice').onchange = function () { S.setVoice(this.value); if (!S.sound) setSoundBtn(S.setSound(true)); if (sel) say(sel, 'Coucou, c\'est ma voix !', true); };
  $('#b-music').onclick = function () { var on = S.setMusic(!S.music); $('#b-music').setAttribute('aria-pressed', String(on)); };
  $('#b-team').onclick = function () {
    team = team === 'orig' ? 'ia' : 'orig'; $('#b-team').setAttribute('aria-pressed', String(team === 'ia'));
    if (sel) sel = twinOf(sel); talkQueue = []; toast(team === 'ia' ? 'Les versions coachées par Claude' : 'Les Chubbies originaux'); render();
  };
  $('#b-zones').onclick = function () { var on = document.body.classList.toggle('zones'); this.setAttribute('aria-pressed', String(on)); };
  $('#b-panels').onclick = function () { var off = document.body.classList.toggle('nopanels'); this.setAttribute('aria-pressed', String(!off)); };
  // Le son ne démarre qu'après un geste : on rétablit les choix d'hier au premier clic.
  var wantSound = (function () { try { return localStorage.getItem('chubby-son') === '1'; } catch (e) { return false; } })();
  if (wantSound) document.addEventListener('pointerdown', function first() {
    document.removeEventListener('pointerdown', first);
    setSoundBtn(S.setSound(true)); if (S.wantsMusic()) $('#b-music').setAttribute('aria-pressed', String(S.setMusic(true)));
  });
  var toastTimer;
  function toast(t) { var el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.style.display = 'none'; }, 2600); }
  if (innerWidth <= 900) $('#b-more').style.display = 'block';
  $('#feed-more').onclick = function () { var on = document.body.classList.toggle('feedopen'); this.setAttribute('aria-expanded', String(on)); this.textContent = on ? 'Réduire ⤡' : 'Tout voir ⤢'; };
  $('#b-more').onclick = function () { document.body.classList.toggle('showctrl'); document.body.classList.toggle('showfeed'); };

  // ---------- données ----------
  function loadLive(first) {
    return fetch('/api/live').then(function (r) { return r.json(); }).then(function (d) {
      var wasEnd = !live || cursor >= live.times.length - 1;
      if (d && d.ok && d.bots) {
        live = d;
        if (wasEnd) cursor = live.times.length - 1;
        $('#feed-dot').className = 'dot' + (live.open ? '' : ' off');
      } else if (first) { setMode('replay'); toast((d && d.error) || 'Pas de séance en direct : je rejoue la saison.'); }
      if (mode === 'live') render();
    }).catch(function () { if (first) setMode('replay'); });
  }
  fetch('/api/replay').then(function (r) { return r.json(); }).then(function (d) {
    replay = d; if (mode === 'replay') cursor = d.days.length - 1;
    // Les fiches de tout le monde, pour le rang et les ordres de demain.
    (d.bots || []).forEach(function (b) { fetch('/api/bots/' + encodeURIComponent(b.id) + '/fiche').then(function (r) { return r.json(); }).then(function (f) { if (!f.erreur) { fiches[b.id] = f; drawSide(); } }); });
    render();
  });
  loadLive(true);
  setInterval(function () { if (!document.hidden) loadLive(false); }, 60000);
})();
</script>
</body>
</html>
