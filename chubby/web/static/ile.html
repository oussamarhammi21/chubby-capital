<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chubby Capital · l'île</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
:root {
  --ink: #2A2838; --muted: #59566C; --panel: rgba(255, 255, 255, 0.92); --line: rgba(42, 40, 56, 0.12);
  --accent: #5B47C2; --up: #1C7347; --down: #B13A2A;
  --display: 'Fredoka', 'Nunito', system-ui, sans-serif; --body: 'Nunito', system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: #CFE6F7; color: var(--ink); font-family: var(--body); overflow: hidden; }
#app { position: fixed; inset: 0; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.label { position: absolute; left: 0; top: 0; background: var(--panel); border-radius: 999px; padding: 3px 9px; font: 800 12px/1.3 var(--body); white-space: nowrap; box-shadow: 0 2px 6px rgba(42,40,56,0.12); display: flex; gap: 6px; }
.label.sel { background: var(--accent); color: #fff; }
.speech { position: absolute; left: 0; top: 0; max-width: 220px; background: #fff; color: var(--ink); border-radius: 16px 16px 16px 4px; padding: 7px 11px; font: 700 13px/1.35 var(--body); box-shadow: 0 4px 14px rgba(42,40,56,0.18); white-space: normal; }
#sound[aria-pressed="true"], #music[aria-pressed="true"] { background: var(--accent); color: #fff; }
.label.sel .up, .label.sel .down { color: #fff; }
.up { color: var(--up); } .down { color: var(--down); }

.hud { position: absolute; inset: 0; pointer-events: none; display: grid; grid-template-columns: minmax(0, 340px) 1fr minmax(0, 290px); grid-template-rows: auto 1fr auto; gap: 12px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.panel { pointer-events: auto; background: var(--panel); border-radius: 20px; box-shadow: 0 6px 24px rgba(42,40,56,0.14); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.brand { padding: 10px 16px; }
.brand b { font: 700 20px/1.1 var(--display); display: block; }
.brand a { font-size: 13px; color: var(--accent); font-weight: 800; }
.clock { padding: 10px 16px; display: flex; flex-direction: column; font-weight: 800; font-size: 13px; }
.clock b { font: 700 20px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.clock span { color: var(--muted); }
.btn { min-height: 44px; padding: 0 14px; border: 0; border-radius: 14px; background: transparent; color: var(--ink); font: 800 14px var(--body); cursor: pointer; }
.btn:hover { background: rgba(91,71,194,0.1); }
.btn[aria-pressed="true"] { background: var(--ink); color: #fff; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.ghost { border: 2px solid var(--line); }
#golive[aria-pressed="true"] { background: #E5484D; color: #fff; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.timeline { grid-column: 2; grid-row: 3; align-self: end; padding: 8px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.timeline input { flex: 1 1 180px; accent-color: var(--accent); min-height: 44px; }
.timeline label { font-size: 13px; font-weight: 800; color: var(--muted); }

.board { grid-column: 3; grid-row: 2 / 4; align-self: start; padding: 14px; max-height: 100%; overflow: auto; }
h2 { margin: 0 0 8px; font: 600 17px var(--display); }
.ranks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.rank { width: 100%; display: grid; grid-template-columns: 22px 14px 1fr auto; align-items: center; gap: 8px; text-align: left; min-height: 48px; padding: 6px 8px; border: 0; border-radius: 14px; background: transparent; color: var(--ink); font: 700 14px var(--body); cursor: pointer; }
.rank:hover, .rank.sel { background: rgba(91,71,194,0.1); }
.rank .pos { font: 700 17px var(--display); text-align: center; }
.rank .sw { width: 14px; height: 14px; border-radius: 50%; }
.rank .nm { display: flex; flex-direction: column; min-width: 0; }
.rank .nm small { color: var(--muted); font-size: 12px; font-weight: 700; }
.rank .sc { text-align: right; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
.rank .sc b { font: 700 16px var(--display); }
.rank .sc small { font-size: 12px; font-weight: 800; }

.feed { grid-column: 1; grid-row: 3; align-self: end; padding: 14px; max-height: 30vh; overflow: auto; }
.feed ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; }
.feed time { color: var(--muted); margin-right: 6px; font-variant-numeric: tabular-nums; }

.card { grid-column: 1; grid-row: 2; align-self: start; padding: 16px; display: flex; flex-direction: column; gap: 12px; max-height: 100%; overflow: auto; }
.card-head { display: flex; gap: 12px; align-items: center; }
.card-head .sw { width: 40px; height: 40px; border-radius: 50%; flex: none; box-shadow: inset -6px -8px 0 rgba(0,0,0,0.12), inset 6px 6px 0 rgba(255,255,255,0.5); }
.card-head h2 { margin: 0; font-size: 22px; }
.card-head p { margin: 0; color: var(--muted); font-weight: 700; font-size: 13px; }
.card-head .x { margin-left: auto; width: 44px; padding: 0; font-size: 22px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; }
.stats div { background: rgba(42,40,56,0.05); border-radius: 12px; padding: 8px 10px; }
.stats dt { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.stats dd { margin: 0; font: 600 17px var(--display); font-variant-numeric: tabular-nums; }
.journal { margin: 0; font-size: 14px; background: rgba(42,40,56,0.05); border-radius: 12px; padding: 10px 12px; }
.bubble { margin: 0; background: #FFF4CF; border-radius: 14px 14px 14px 4px; padding: 10px 12px; font-size: 14px; font-weight: 700; }
.coach { display: flex; flex-direction: column; gap: 8px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.note { margin: 0; font-size: 12px; color: var(--muted); font-weight: 700; }
.toast { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); padding: 16px 24px; text-align: center; pointer-events: none; }
.toast b { display: block; font: 700 26px var(--display); }
.toast span { font-weight: 700; color: var(--muted); }
.msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 20px 24px; max-width: min(420px, 90vw); text-align: center; font-weight: 700; }

@media (max-width: 760px) {
  .hud { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto auto; gap: 8px; }
  .card { grid-row: 3; align-self: end; max-height: 46vh; }
  .timeline { grid-column: 1; grid-row: 4; }
  .board { grid-column: 1; grid-row: 3; align-self: end; max-height: 22vh; padding: 10px; }
  .hud.has-card .board, .feed { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="L'île en 3D où les Chubbies rejouent les séances de l'arène. Clique sur un Chubby, ou choisis-le dans le classement, pour voir sa fiche."></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div class="hud" id="hud">
    <header class="top">
      <div class="brand panel"><b>Chubby Capital</b><a href="/">Tableau de bord</a></div>
      <div class="clock panel" role="status"><b id="date">—</b><span id="status">Chargement…</span></div>
      <div class="panel" style="padding:6px;display:flex;gap:4px;flex-wrap:wrap" role="group" aria-label="Caméra">
        <button class="btn ghost" id="sound" aria-pressed="false" title="Les Chubbies parlent et font des petits bruits">🔇 Son</button>
        <button class="btn ghost" id="music" aria-pressed="false" title="Petite musique d'ascenseur en fond">🎵 Musique</button>
        <button class="btn ghost" id="overview">Vue d'ensemble</button>
      </div>
    </header>

    <section class="card panel" id="card" hidden aria-live="polite">
      <div class="card-head">
        <span class="sw" id="c-sw"></span>
        <div><h2 id="c-name"></h2><p id="c-role"></p></div>
        <button class="btn x" id="c-close" aria-label="Fermer la fiche">×</button>
      </div>
      <dl class="stats">
        <div><dt>Capital</dt><dd id="c-val"></dd></div>
        <div><dt id="c-day-label">Ce jour-là</dt><dd id="c-day"></dd></div>
        <div><dt>Saison</dt><dd id="c-season"></dd></div>
        <div><dt>Score</dt><dd id="c-score"></dd></div>
        <div><dt>Rang</dt><dd id="c-rank"></dd></div>
        <div><dt>Agressivité</dt><dd id="c-aggr"></dd></div>
      </dl>
      <p class="journal" id="c-last"></p>
      <div id="coach" class="coach" hidden>
        <p class="bubble" id="coach-q"></p>
        <div class="opts" id="coach-opts"></div>
      </div>
      <button class="btn primary" id="c-coach">Coacher</button>
      <p class="note">Ton conseil change son agressivité pour ses prochaines séances dans l'arène.</p>
    </section>

    <aside class="board panel" aria-labelledby="rk-title">
      <h2 id="rk-title">Classement</h2>
      <ol class="ranks" id="ranks"></ol>
    </aside>

    <section class="feed panel" aria-labelledby="feed-title">
      <h2 id="feed-title">Ce jour-là</h2>
      <ul id="feed"></ul>
    </section>

    <div class="timeline panel" role="group" aria-label="Lecture de la saison">
      <button class="btn" id="golive" hidden aria-pressed="false">● En direct</button>
      <button class="btn" id="play" aria-label="Lecture ou pause">Pause</button>
      <button class="btn" id="sp1" aria-pressed="true">×1</button>
      <button class="btn" id="sp10" aria-pressed="false">×10</button>
      <button class="btn" id="sp50" aria-pressed="false">×50</button>
      <label for="scrub" id="scrub-label">Jour</label>
      <input type="range" id="scrub" min="0" max="0" value="0">
      <button class="btn ghost" id="restart">Rejouer la saison</button>
    </div>
  </div>
  <div class="toast panel" id="toast" hidden><b id="toast-t"></b><span id="toast-s"></span></div>
  <div class="msg panel" id="msg" hidden></div>
</div>

<script src="/static/vendor/three.min.js"></script>
<script>
(function () {
  'use strict';
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function (s) { return document.querySelector(s); };

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function message(text) { var m = $('#msg'); m.textContent = text; m.hidden = !text; }

  if (!window.THREE) { message("La 3D n'a pas pu se charger."); return; }

  var LOOK = {
    tortue: { color: 0xB5D6EE, css: '#6FA3CF', sy: 0.95 }, flan: { color: 0xFBE29A, css: '#E2B84A', sy: 0.92 },
    dumpling: { color: 0xB4E0DD, css: '#5FB3AC', sy: 1.15 }, mochi: { color: 0xDCC8E6, css: '#B79BD0', sy: 0.9 },
    muffin: { color: 0xF7C9AE, css: '#E0956E', sy: 0.92 }, jalapeno: { color: 0xF2A39A, css: '#D9665C', sy: 0.95 },

  };
  var ZONE_ORDER = ['mochi', 'flan', 'dumpling', 'tortue', 'muffin', 'jalapeno', 'matcha'];
  function baseId(id) { return String(id).replace(/-ia$/, ''); }
  function isAI(id) { return /-ia$/.test(String(id)); }
  function kindOf(id) { return baseId(id).replace(/-v\d+$/, ''); } // Jalapeño v2 a l'allure de Jalapeño
  function pretty(t) { var p = String(t).split(':'); return p[0] === 'OPT' ? (p[2] === 'C' ? 'call ' : 'put ') + p[1] + ' ' + p[3] : t; }

  // ---------- Scène ----------
  var canvas = $('#scene');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  var scene = new THREE.Scene();
  var DAY_SKY = new THREE.Color(0xCFE6F7), NIGHT_SKY = new THREE.Color(0x2E3558);
  scene.background = DAY_SKY.clone(); scene.fog = new THREE.Fog(scene.background.clone(), 45, 95);
  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
  var hemi = new THREE.HemisphereLight(0xFFFFFF, 0xB7D3A8, 0.85); scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xFFFFFF, 0.85); sun.position.set(10, 18, 8); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  var sc = sun.shadow.camera; sc.left = -18; sc.right = 18; sc.top = 18; sc.bottom = -18; sc.near = 1; sc.far = 60; scene.add(sun);

  function mat(c, o) { var m = new THREE.MeshStandardMaterial({ color: c, roughness: 0.6 }); if (o) Object.assign(m, o); return m; }

  scene.add(mesh(new THREE.CylinderGeometry(14.2, 14.8, 0.6, 72), mat(0xEED9A8), 0, -0.85, 0, false));
  scene.add(mesh(new THREE.CylinderGeometry(13, 13.6, 1.2, 72), mat(0xA8D8A0), 0, -0.6, 0, false));
  scene.add(mesh(new THREE.CylinderGeometry(4.8, 4.8, 0.08, 56), mat(0xF3E9DA), 0, 0.04, 0, false));
  var PODIUM = [{ x: 0, h: 1.3 }, { x: -1.7, h: 0.9 }, { x: 1.7, h: 0.6 }];
  [0xFFE7A3, 0xE9E6F2, 0xF6D3BE].forEach(function (c, i) { scene.add(mesh(new THREE.BoxGeometry(1.5, PODIUM[i].h, 1.5), mat(c), PODIUM[i].x, PODIUM[i].h / 2, 0.9)); });

  var boardCv = document.createElement('canvas'); boardCv.width = 512; boardCv.height = 256;
  var bctx = boardCv.getContext('2d'), boardTex = new THREE.CanvasTexture(boardCv);
  var boardGrp = new THREE.Group(); boardGrp.position.set(0, 0, -3.9);
  boardGrp.add(mesh(new THREE.BoxGeometry(4.6, 2.4, 0.18), mat(0x2A2838), 0, 2.2, 0));
  var face = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 2.2), new THREE.MeshBasicMaterial({ map: boardTex })); face.position.set(0, 2.2, 0.1); boardGrp.add(face);
  boardGrp.add(mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.1, 10), mat(0x8E8AA3), -1.8, 0.55, 0));
  boardGrp.add(mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.1, 10), mat(0x8E8AA3), 1.8, 0.55, 0));
  scene.add(boardGrp);

  for (var t = 0; t < 6; t++) {
    var ta = t * Math.PI / 3, tree = new THREE.Group(); tree.position.set(Math.sin(ta) * 11.8, 0, Math.cos(ta) * 11.8);
    tree.add(mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.9, 8), mat(0xA27B5C), 0, 0.45, 0));
    tree.add(mesh(new THREE.SphereGeometry(0.8, 20, 14), mat(0x8FCB86), 0, 1.5, 0));
    tree.add(mesh(new THREE.SphereGeometry(0.55, 20, 14), mat(0x9ED696), 0.4, 1.9, 0.2));
    scene.add(tree);
  }

  function buildZone(id, g) {
    if (id === 'flan') {
      g.add(mesh(new THREE.BoxGeometry(2.2, 1.5, 1.8), mat(0xFFF3D6), 0, 0.75, 0));
      var roof = mesh(new THREE.ConeGeometry(1.75, 1.0, 4), mat(0xE2B84A), 0, 2.0, 0); roof.rotation.y = Math.PI / 4; g.add(roof);
      g.add(mesh(new THREE.BoxGeometry(0.6, 0.9, 0.05), mat(0xC88A3E), 0, 0.45, 0.92));
      g.add(mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.12, 24), mat(0xE9B730, { metalness: 0.5, roughness: 0.35 }), 0, 1.25, 0.95));
    } else if (id === 'mochi') {
      var ring = mesh(new THREE.TorusGeometry(1.7, 0.14, 10, 48), mat(0xB79BD0), 0, 0.1, 0); ring.rotation.x = Math.PI / 2; g.add(ring);
      g.add(mesh(new THREE.CylinderGeometry(0.05, 0.05, 2, 8), mat(0x8E8AA3), 1.7, 1, 0));
      g.add(mesh(new THREE.BoxGeometry(0.7, 0.45, 0.04), mat(0x5B47C2), 2.05, 1.75, 0));
    } else if (id === 'dumpling') {
      g.add(mesh(new THREE.BoxGeometry(2.6, 0.2, 2.2), mat(0xA27B5C), 0, 0.1, 0));
      [0x7CC46F, 0xF2A39A, 0xFBE29A, 0x8FCB86, 0xDCC8E6, 0x7CC46F].forEach(function (c, k) { g.add(mesh(new THREE.SphereGeometry(0.28, 14, 10), mat(c), -0.8 + (k % 3) * 0.8, 0.4, -0.5 + Math.floor(k / 3))); });
    } else if (id === 'tortue') {
      var pond = new THREE.Mesh(new THREE.CircleGeometry(1.7, 40), mat(0x8CC8E8, { roughness: 0.2 })); pond.rotation.x = -Math.PI / 2; pond.position.y = 0.03; g.add(pond);
      [[1.8, 0.4], [-1.6, -0.8], [0.6, -1.8], [-0.9, 1.5]].forEach(function (s) { g.add(mesh(new THREE.DodecahedronGeometry(0.32), mat(0xB9B6C6), s[0], 0.2, s[1])); });
    } else if (id === 'muffin') {
      g.add(mesh(new THREE.BoxGeometry(2.2, 1.4, 1.6), mat(0xFFEDE2), 0, 0.7, 0));
      for (var s = 0; s < 4; s++) { var aw = mesh(new THREE.BoxGeometry(0.55, 0.08, 0.7), mat(s % 2 ? 0xFFFFFF : 0xE0956E), -0.83 + s * 0.55, 1.35, 1.0); aw.rotation.x = 0.35; g.add(aw); }
    } else if (id === 'jalapeno') {
      g.add(mesh(new THREE.CylinderGeometry(0.5, 0.55, 2.2, 20), mat(0xFFFFFF), 0, 1.3, 0));
      g.add(mesh(new THREE.ConeGeometry(0.5, 0.9, 20), mat(0xD9665C), 0, 2.85, 0));
      for (var f = 0; f < 3; f++) { var fa = f * Math.PI * 2 / 3, fin = mesh(new THREE.BoxGeometry(0.08, 0.7, 0.5), mat(0xD9665C), Math.sin(fa) * 0.55, 0.45, Math.cos(fa) * 0.55); fin.rotation.y = fa; g.add(fin); }

      g.add(mesh(new THREE.BoxGeometry(2.0, 1.2, 1.6), mat(0xEEF8E2), 0, 0.6, 0));
      g.add(mesh(new THREE.BoxGeometry(2.6, 0.18, 2.2), mat(0x7DB35A), 0, 1.3, 0));
      g.add(mesh(new THREE.CylinderGeometry(0.35, 0.28, 0.4, 18), mat(0x93C26E), 0.6, 0.2, 1.1));
    } else {
      g.add(mesh(new THREE.BoxGeometry(1.6, 1.2, 1.4), mat(0xE9E6F2), 0, 0.6, 0));
    }
  }

  var eyeGeo = new THREE.SphereGeometry(0.09, 16, 12), hiGeo = new THREE.SphereGeometry(0.03, 8, 6);
  var eyeMat = mat(0x1E1D26, { roughness: 0.25 }), hiMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
  var mouthGeo = new THREE.TorusGeometry(0.1, 0.022, 8, 18, Math.PI);
  var blushMat = new THREE.MeshBasicMaterial({ color: 0xF48C8C, transparent: true, opacity: 0.55 });
  var coinGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.06, 22), coinMat = mat(0xE9B730, { metalness: 0.55, roughness: 0.3 });
  var zzzCv = document.createElement('canvas'); zzzCv.width = 128; zzzCv.height = 64;
  var zc = zzzCv.getContext('2d'); zc.fillStyle = '#5B47C2'; zc.font = '700 44px Fredoka, sans-serif'; zc.fillText('Zzz', 18, 48);
  var zzzMat = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(zzzCv), transparent: true, depthWrite: false });

  var antennaMat = new THREE.MeshBasicMaterial({ color: 0xB8A9FF });
  function makeChubby(fullId, color, sy, idx) {
    var id = kindOf(fullId);
    var g = new THREE.Group(); g.userData.bot = idx;
    var body = new THREE.Group(); g.add(body);
    var bodyMat = mat(color, { roughness: 0.5 }), dk = mat(new THREE.Color(color).multiplyScalar(0.85), { roughness: 0.5 });
    body.add(mesh(new THREE.SphereGeometry(0.8, 40, 28), bodyMat, 0, 0.8, 0));
    var eyes = [];

    if (b.hop >= 0) { b.hop += dt * 2.2; if (b.hop >= 1) b.hop = -1; else { hopY = Math.sin(Math.PI * b.hop) * 0.8; squash = 1 + Math.sin(Math.PI * b.hop) * 0.12; } }
    var breathe = reduceMotion ? 0 : Math.sin(t * (sleeping ? 1.4 : 2.6) + b.i) * (sleeping ? 0.05 : 0.03);
    b.group.position.y = b.baseY + hopY;
    b.body.scale.set(1 - breathe * 0.5 - (squash - 1) * 0.4, b.sy * (1 + breathe) * squash, 1 - breathe * 0.5 - (squash - 1) * 0.4);
    var faceDir = b.facing != null ? b.facing : Math.atan2(camera.position.x - b.group.position.x, camera.position.z - b.group.position.z);
    var cur = b.group.rotation.y, diff = Math.atan2(Math.sin(faceDir - cur), Math.cos(faceDir - cur)); b.group.rotation.y = cur + diff * Math.min(1, dt * 6);
    b.eyes.forEach(function (e) { e.scale.y = sleeping ? 0.15 : 1; });
    var worried = mood === 'inquiet' && !sleeping;
    b.mouth.rotation.z = worried ? 0 : Math.PI; b.mouth.position.y = worried ? 0.68 : 0.76; b.mouth.scale.setScalar(mood === 'calme' || sleeping ? 0.7 : 1);
    if (b.talk > 0) { b.talk -= dt; b.mouth.scale.set(1.1, 0.5 + Math.abs(Math.sin(t * 19 + b.i)) * 1.4, 1); } // la bouche bouge quand il parle
    if (b.sayTimer > 0) b.sayTimer -= dt;
    b.sweat.visible = worried; if (worried) b.sweat.position.y = 1.35 - ((t * 0.6 + b.i) % 1) * 0.35;
    b.zzz.visible = sleeping; if (sleeping) b.zzz.position.y = 2.0 + Math.sin(t * 1.5 + b.i) * 0.12;
    if (b.coin.visible) b.coin.rotation.z += dt * 5;
  }

  var labelVec = new THREE.Vector3(), W = 1, H = 1;
  function updateLabels() {
    bots.forEach(function (b) {
      labelVec.copy(b.group.position); labelVec.y += 2.25 * b.sy + 0.15; labelVec.project(camera);
      if (labelVec.z > 1) { b.label.style.display = 'none'; b.speech.hidden = true; return; }
      b.label.style.display = '';
      var pos = 'translate(' + ((labelVec.x * 0.5 + 0.5) * W).toFixed(1) + 'px,' + ((-labelVec.y * 0.5 + 0.5) * H).toFixed(1) + 'px) ';
      b.label.style.transform = pos + 'translate(-50%,-100%)';
      var talking = b.sayTimer > 0;
      if (b.speech.hidden === talking) b.speech.hidden = !talking;
      if (talking) { if (b.speech.textContent !== b.sayText) b.speech.textContent = b.sayText; b.speech.style.transform = pos + 'translate(-12px, calc(-100% - 30px))'; }
    });
  }
  function refreshLabels() {
    bots.forEach(function (b) {
      var d = dayPct(b); b.label.className = 'label' + (selected === b ? ' sel' : '');
      b.label.innerHTML = ''; var n = document.createElement('span'); n.textContent = b.name; var v = document.createElement('span'); v.className = cls(d); v.textContent = pct(d);
      b.label.appendChild(n); b.label.appendChild(v);
    });
  }
  function nightAmount() { if (fast()) return 0; if (tDay < 0.06) return 0.5 - tDay / 0.12; if (tDay < 0.9) return 0; return clamp((tDay - 0.9) / 0.1, 0, 1) * 0.8; }
  function resize() { W = canvas.clientWidth || window.innerWidth; H = canvas.clientHeight || window.innerHeight; renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix(); if (!selected) wantRadius = baseRadius(); }
  window.addEventListener('resize', resize);

  var clock = new THREE.Clock(), uiTimer = 0;
  function frame() {
    var dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    if (data && data.days.length) {
      if (playing && !liveMode && !atEnd()) {
        tDay += dt * speed / DAY_SECONDS;
        dayEvents.forEach(function (x) { if (!x.done && tDay >= x.at) { x.done = true; fire(x.e); } });
        if (tDay >= 1) {
          if (dayIdx < data.days.length - 1) startDay(dayIdx + 1);
          else { tDay = 1; setPlaying(false); $('#status').textContent = 'Dernière séance jouée'; }
        }
      }
      var ph = phaseOf(Math.min(tDay, 0.999));
      if (ph !== lastPhase) { lastPhase = ph; onPhase(ph); }
      bots.forEach(function (b) { updateBot(b, dt, t); });
      talkTick(dt);
      var n = nightAmount(); scene.background.copy(DAY_SKY).lerp(NIGHT_SKY, n); scene.fog.color.copy(scene.background);
      hemi.intensity = 0.85 - 0.45 * n; sun.intensity = 0.85 - 0.6 * n;
      uiTimer -= dt;
      if (uiTimer <= 0) {
        uiTimer = 0.3; updateRanks(); refreshLabels(); updateCard(); drawBoard();
        if (liveMode) $('#status').textContent = (live.open ? 'En direct · ' : 'Bourse fermée · ') + live.as_of;
        else if (!atEnd()) $('#status').textContent = fast() ? 'Saison en accéléré' : { morning: 'Avant l’ouverture', open: 'Bourse ouverte', ceremony: 'Remise des médailles', evening: 'Bourse fermée' }[ph];
      }
    }
    sparks.forEach(function (s) { if (s.life <= 0) return; s.v.y -= 7 * dt; s.m.position.addScaledVector(s.v, dt); s.m.rotation.y += dt * 6; s.life -= dt * 1.1; s.m.scale.setScalar(Math.max(s.life, 0.01)); if (s.life <= 0) s.m.visible = false; });
    coins.forEach(function (co) {
      if (co.life <= 0) return;
      if (co.m.position.y > 0.12) { co.vy -= 9 * dt; co.m.position.y = Math.max(0.12, co.m.position.y + co.vy * dt); co.m.rotation.x += dt * co.spin; }
      else { co.life -= dt * 0.8; co.m.scale.setScalar(Math.max(co.life, 0.01)); if (co.life <= 0) co.m.visible = false; }
    });
    if (selected) { wantTarget.copy(selected.group.position); wantTarget.y = 0.8; }
    if (!dragging && !interacted && !selected && !reduceMotion) az += dt * 0.04;
    camTarget.lerp(wantTarget, Math.min(1, dt * 3)); radius += (wantRadius - radius) * Math.min(1, dt * 3); placeCamera();
    if (selected) { selRing.visible = true; selRing.position.set(selected.group.position.x, selected.baseY + 0.03, selected.group.position.z); } else selRing.visible = false;
    if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) $('#toast').hidden = true; }
    updateLabels();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  resize(); radius = wantRadius; placeCamera(); requestAnimationFrame(frame);
  fetch('/api/replay').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) {
    data = d;
    if (!d.days.length) { message('Aucune séance jouée dans cette base pour l’instant. Lance un backtest, ou attends la première séance de l’arène.'); return; }
    buildBots();
    $('#scrub').max = d.days.length - 1;
    startDay(d.days.length - 1); // on rejoue la dernière séance
    // Pendant la bourse, l'île s'ouvre directement sur la vraie séance.
    fetch('/api/live').then(function (r) { return r.ok ? r.json() : null; }).then(function (lv) { applyLive(lv); if (lv && lv.ok && lv.open) setLive(true); }).catch(function () {});
    setInterval(pollLive, 60000);
  }).catch(function () { message('Impossible de charger l’arène. Le serveur « chubby web » tourne-t-il toujours ?'); });
})();
</script>
</body>
