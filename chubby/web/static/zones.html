<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chubby Capital · la ville</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
:root {
  /* Centre-ville la nuit : bleu nuit, néon cyan, fenêtres ambrées */
  --ink: #E8EEF7; --muted: #9AA7BD; --panel: rgba(13, 18, 29, 0.88); --line: rgba(255, 255, 255, 0.14);
  --accent: #3DD6F5; --accent-ink: #04141A; --up: #5BE3A0; --down: #FF7B7B; --sky: #070A12; --soft: rgba(255, 255, 255, 0.06);
  --display: 'Fredoka', 'Nunito', system-ui, sans-serif; --body: 'Nunito', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: radial-gradient(ellipse at 50% -20%, #1B2742 0%, var(--sky) 65%) fixed; color: var(--ink); font-family: var(--body); overflow: hidden; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
#ui { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; }
.up { color: var(--up); } .down { color: var(--down); }
.panel { background: var(--panel); border-radius: 18px; border: 1px solid rgba(61,214,245,0.16); box-shadow: 0 8px 24px rgba(0,0,0,0.45); }
.btn { min-height: 40px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: var(--ink); font: 800 13px var(--body); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: rgba(61,214,245,0.14); }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
select.btn option { background: #0E131E; color: var(--ink); }
select.btn { border: 2px solid var(--line); }
button:focus-visible, a:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Bandeau du haut */
.top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 8px; }
.brand { padding: 8px 14px; display: flex; align-items: center; gap: 8px; }
.brand b { font: 700 18px/1.1 var(--display); }
.clock { padding: 6px 14px; display: flex; flex-direction: column; font-size: 12px; font-weight: 800; }
.clock b { font: 700 16px/1.2 var(--display); }
.clock span { color: var(--muted); }
.idx { padding: 6px 12px; display: flex; gap: 14px; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
.idx span { white-space: nowrap; }
.tools { margin-left: auto; padding: 4px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }

/* La mosaïque : une île par Chubby */
#grid { flex: 1; overflow-y: auto; padding: 4px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px;
  grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); align-content: start; }
.tile { position: relative; display: block; width: 100%; border-radius: 20px; overflow: hidden; cursor: pointer; border: 2px solid rgba(61,214,245,0.22);
  box-shadow: 0 8px 22px rgba(0,0,0,0.5); background: transparent; padding: 0; text-align: left; font: inherit; color: inherit; }
.tile::before { content: ''; display: block; padding-top: 75%; } /* 4:3, comme la caméra de l'île */
.tile:hover { border-color: var(--accent); }
.tile .head { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
.tile .who { background: var(--panel); border-radius: 999px; padding: 3px 10px 3px 4px; display: flex; align-items: center; gap: 6px; font: 700 15px var(--display); box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
.tile .who small { font: 800 13px var(--body); font-variant-numeric: tabular-nums; }
.tile .doing { position: absolute; left: 8px; right: 8px; bottom: 8px; background: var(--panel); border-radius: 12px; padding: 6px 10px; font-size: 13px; font-weight: 800;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4); pointer-events: none; display: flex; gap: 8px; align-items: baseline; }
.tile .doing span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .doing time { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.bubble { position: absolute; left: 0; top: 0; max-width: min(240px, 70%); background: #141B2B; color: var(--ink); border: 1px solid rgba(61,214,245,0.3); border-radius: 14px 14px 14px 4px; padding: 6px 10px;
  font: 700 12px/1.35 var(--body); box-shadow: 0 4px 14px rgba(0,0,0,0.5); pointer-events: none; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.bubble.big { font-size: 14px; max-width: min(320px, 60%); -webkit-line-clamp: 6; }
.bubble.trade { background: #2A2210; border-color: rgba(255,181,71,0.65); }

/* Vue d'un seul Chubby (ou de toutes les îles) */
#focus { flex: 1; display: grid; grid-template-columns: 1fr minmax(0, 360px); gap: 12px; padding: 4px 16px calc(16px + env(safe-area-inset-bottom, 0px)); min-height: 0; }
#stage { position: relative; border-radius: 22px; overflow: hidden; touch-action: none; cursor: grab; border: 2px solid rgba(61,214,245,0.22); min-height: 0; }
#stage .nav { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; }
#stage .nav .btn { background: var(--panel); min-width: 40px; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
#stage .hint { position: absolute; left: 10px; bottom: 10px; background: var(--panel); border-radius: 10px; padding: 4px 10px; font-size: 12px; font-weight: 700; color: var(--muted); pointer-events: none; }
#side { padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.side-head { display: flex; gap: 10px; align-items: center; }
.side-head h2 { margin: 0; font: 600 22px var(--display); }
.side-head p { margin: 0; color: var(--muted); font-weight: 700; font-size: 13px; }
h3 { margin: 0 0 6px; font: 600 15px var(--display); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 0; }
.stats div { background: var(--soft); border-radius: 12px; padding: 6px 8px; }
.stats dt { font-size: 11px; font-weight: 800; color: var(--muted); }
.stats dd { margin: 0; font: 600 16px var(--display); font-variant-numeric: tabular-nums; }
.now { margin: 0; background: #0F2230; border: 1px solid rgba(61,214,245,0.35); border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 700; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; }
.list li { background: var(--soft); border-radius: 10px; padding: 7px 9px; }
.list time { color: var(--muted); margin-right: 6px; font-variant-numeric: tabular-nums; }
.gauge { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12); margin-top: 5px; overflow: hidden; }
.gauge i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.muted { color: var(--muted); font-size: 12px; font-weight: 700; margin: 0; }
.toast { position: fixed; left: 50%; top: 84px; transform: translateX(-50%); z-index: 3; padding: 10px 18px; text-align: center; pointer-events: none; max-width: calc(100vw - 32px); font-weight: 800; }
.toast b { font: 700 17px var(--display); margin-right: 6px; }
.msg { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3; padding: 20px 24px; max-width: min(420px, 90vw); text-align: center; font-weight: 700; }

@media (max-width: 999px) { #grid { --cols: 2; } }
@media (max-width: 599px) {
  #grid { --cols: 1; }
  .idx { display: none; }
  .top { flex-wrap: wrap; }
  .tools { margin-left: 0; width: 100%; flex-wrap: nowrap; overflow-x: auto; }
  .tools .btn { flex: none; }
  #focus { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(240px, 48vh) auto; overflow-y: auto; }
  #side { overflow: visible; }
  #stage .hint { display: none; }
}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="ui">
  <header class="top">
    <div class="brand panel"><span id="logo"></span><b>Chubby Capital</b></div>
    <div class="clock panel" role="status"><b id="date">—</b><span id="status">Chargement…</span></div>
    <div class="idx panel" id="idx" hidden></div>
    <div class="tools panel">
      <button class="btn" id="b-all" aria-pressed="true" title="Un quartier par Chubby, côte à côte">▦ Mosaïque</button>
      <button class="btn" id="b-world" aria-pressed="false" title="Toute la ville d'un seul coup d'œil">🏙 La ville</button>
      <button class="btn" id="b-ai" aria-pressed="false" title="Montrer aussi les jumeaux coachés par Claude">🤖 Versions IA</button>
      <button class="btn" id="b-sound" aria-pressed="false">🔇 Son</button>
      <select class="btn" id="s-voice" aria-label="Voix des Chubbies">
        <option value="mignonne">🐣 Voix mignonnes</option><option value="humaine">🗣 Voix humaines</option><option value="muette">🤐 Muets</option>
      </select>
      <button class="btn" id="b-music" aria-pressed="false">🎵 Musique</button>
      <a class="btn" href="/">← Tableau</a>
    </div>
  </header>
  <main id="grid" aria-label="Un quartier par Chubby"></main>
  <section id="focus" hidden>
    <div id="stage" aria-label="Le quartier du Chubby choisi">
      <div class="nav">
        <button class="btn" id="f-back">← Tous les quartiers</button>
        <button class="btn" id="f-prev" aria-label="Chubby précédent">‹</button>
        <button class="btn" id="f-next" aria-label="Chubby suivant">›</button>
      </div>
      <div class="hint">Glisse pour tourner · molette ou pincement pour zoomer · double-clic pour recentrer</div>
    </div>
    <aside id="side" class="panel" aria-live="polite"></aside>
  </section>
</div>
<div class="toast panel" id="toast" hidden></div>
<div class="msg panel" id="msg" hidden></div>

<script src="/static/vendor/three.min.js"></script>
<script src="/static/chubbies.js"></script>
<script src="/static/sons.js"></script>
<script>
/* Les îles des Chubbies : chacun vit sur sa propre île. On le voit aller à son écran pour analyser ses titres,
   au marché pour acheter, ranger ses caisses (ses positions), revenir les vendre, ou se reposer quand il n'y a rien
   à faire. Chaque geste vient d'un vrai événement : /api/activity (ses ordres, ses stops, ses analyses du jour)
   et /api/live (ses seuils, ses positions et ce qu'il a en tête pendant la séance). */
(function () {
  'use strict';
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var C = window.Chubby, S = window.Sons;
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return C.esc(s); }
  function pct(v) { return C.pct(v || 0); }
  function money(v) { return C.money(v); }
  function num(v) { return Number(v).toLocaleString('fr-CA', { maximumFractionDigits: 2 }); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function message(text) { var m = $('#msg'); m.textContent = text; m.hidden = !text; }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  var toastTimer = null;
  function toast(title, text) {
    var t = $('#toast'); t.innerHTML = '<b>' + esc(title) + '</b>' + esc(text); t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 5000);
  }
  function baseId(id) { return String(id).replace(/-ia$/, ''); }
  function isAI(id) { return /-ia$/.test(String(id)); }
  function kindOf(id) { return baseId(id).replace(/-v\d+$/, ''); }
  function short(t) { var p = String(t).split(':'); return p[0] === 'OPT' ? p[1] + ' ' + (p[2] === 'C' ? 'call' : 'put') : String(t); }

  if (!window.THREE) { message("La 3D n'a pas pu se charger."); return; }
  $('#logo').innerHTML = C.avatar('flan', 'content', 26);

  // ---------- Rendu : une seule scène, une caméra par île ----------
  var canvas = $('#scene');
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true }); }
  catch (e) { message("Ton navigateur n'affiche pas la 3D (WebGL)."); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setClearColor(0x000000, 0);
  var scene = new THREE.Scene();
  // La ville la nuit : brume bleu nuit, lune froide, lumière ambrée des lampadaires
  var DAY = new THREE.Color(0x111A2C), NIGHT = new THREE.Color(0x070A12); // séance : soir ; bourse fermée : nuit noire
  scene.background = DAY.clone(); scene.fog = new THREE.Fog(DAY.clone(), 40, 190);
  var hemi = new THREE.HemisphereLight(0x9DB4FF, 0x1A1A22, 0.65); scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xA8C0FF, 0.5); sun.position.set(-20, 40, 25); scene.add(sun);
  var street = new THREE.DirectionalLight(0xFFB547, 0.35); street.position.set(25, 6, 30); scene.add(street);

  var matCache = {};
  function mat(c, o) {
    var key = o ? null : String(c);
    if (key && matCache[key]) return matCache[key];
    var m = new THREE.MeshStandardMaterial({ color: c, roughness: 0.65 });
    if (o) { if (o.emissive !== undefined) { m.emissive.set(o.emissive); o = Object.assign({}, o); delete o.emissive; } Object.assign(m, o); }
    if (key) matCache[key] = m;
    return m;
  }
  function mesh(geo, material, x, y, z) { var m = new THREE.Mesh(geo, material); m.position.set(x || 0, y || 0, z || 0); return m; }
  function canvasTex(w, h, draw) {
    var cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h);
    var t = new THREE.CanvasTexture(cv); t.anisotropy = 4; t.userData = { cv: cv }; return t;
  }
  function round(c, x, y, w, h, r) { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); }
  function sign(text, w, color) { // enseigne au néon
    var g = new THREE.Group();
    var tex = canvasTex(512, 128, function (c, W, H) {
      c.fillStyle = '#0B0F1A'; c.fillRect(0, 0, W, H);
      c.strokeStyle = color || '#3DD6F5'; c.lineWidth = 6; c.shadowColor = color || '#3DD6F5'; c.shadowBlur = 18; c.strokeRect(10, 10, W - 20, H - 20);
      c.fillStyle = '#FFFFFF'; c.font = '700 60px Fredoka, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, W / 2, H / 2 + 4);
    });
    g.add(mesh(new THREE.BoxGeometry(w, w / 4, 0.1), mat(0x1A1F2A)));
    var f = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.95, w / 4 * 0.88), new THREE.MeshBasicMaterial({ map: tex })); f.position.z = 0.06; g.add(f);
    return g;
  }

  // Le sol de la ville : rues en asphalte mouillé entre les pâtés de maisons, lignes jaunes, reflets qui bougent
  var seaMat = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 }, night: { value: 0 } },
    vertexShader: 'varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
    fragmentShader: 'uniform float time; uniform float night; varying vec3 vW;' +
      'void main(){ vec2 p = vW.xz; vec2 d = abs(mod(p, 24.0) - 12.0); float m = min(d.x, d.y);' +
      'float road = step(m, 3.6); float lane = step(m, 0.09) * step(1.4, mod(p.x + p.y, 3.0));' +
      'vec3 c = mix(vec3(0.10, 0.11, 0.14), vec3(0.055, 0.06, 0.08), road) + lane * road * vec3(0.55, 0.40, 0.10);' +
      'float sheen = pow(sin(p.x * 0.21 + time * 0.3) * sin(p.y * 0.17 - time * 0.2) * 0.5 + 0.5, 6.0) * road;' +
      'c += sheen * vec3(0.10, 0.22, 0.30);' +
      'float far = smoothstep(60.0, 220.0, length(p)); c = mix(c, vec3(0.04, 0.05, 0.08), far);' +
      'gl_FragColor = vec4(c * (1.0 - night * 0.35), 1.0); }'
  });
  var sea = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), seaMat); sea.rotation.x = -Math.PI / 2; sea.position.y = -0.4; scene.add(sea);
  // Les gratte-ciel tout autour, avec leurs fenêtres allumées
  function windowsTex(seed) {
    return canvasTex(64, 128, function (c, W, H) {
      c.fillStyle = '#0C111C'; c.fillRect(0, 0, W, H);
      for (var y = 4; y < H; y += 8) for (var x = 4; x < W; x += 10) {
        var r = Math.abs(Math.sin(x * 12.9 + y * 78.2 + seed * 37.7) * 43758.5) % 1;
        c.fillStyle = r > 0.82 ? '#FFC970' : r > 0.74 ? '#7FDFF5' : r > 0.62 ? '#2A3448' : '#151C2A'; c.fillRect(x, y, 6, 4);
      }
    });
  }
  var towerMats = [0, 1, 2, 3, 4].map(function (k) { var t = windowsTex(k + 1); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2 + k % 2, 3 + k); return new THREE.MeshBasicMaterial({ map: t }); });
  var roofMat = new THREE.MeshBasicMaterial({ color: 0x0A0E17 }), beaconMat = new THREE.MeshBasicMaterial({ color: 0xFF4D5E });
  var towers = new THREE.Group(); scene.add(towers);
  function tower(x, z, w, h, k) {
    var m = towerMats[k % towerMats.length], t = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), [m, m, roofMat, roofMat, m, m]);
    t.position.set(x, h / 2 - 0.4, z); towers.add(t);
    if (h > 40) towers.add(mesh(new THREE.SphereGeometry(0.35, 8, 6), beaconMat, x, h, z));
  }
  function buildSkyline(radius, cells) {
    towers.clear();
    // Les pâtés de maisons libres autour des quartiers se remplissent d'immeubles : on est en plein centre-ville.
    var xs = cells.map(function (c) { return c[0]; }), zs = cells.map(function (c) { return c[1]; }), k = 0;
    for (var cx = Math.min.apply(null, xs) - 2; cx <= Math.max.apply(null, xs) + 2; cx++) {
      for (var cz = Math.min.apply(null, zs) - 2; cz <= Math.max.apply(null, zs) + 1; cz++) {
        if (cells.some(function (c) { return c[0] === cx && c[1] === cz; })) continue;
        [[-4.2, -4.2], [4.2, -4.2], [-4.2, 4.2], [4.2, 4.2]].forEach(function (q, j) {
          k++; if ((cx * 7 + cz * 13 + j * 5) % 4 === 0) return; // quelques trous entre les immeubles
          tower(cx * SPACING + q[0], cz * SPACING + q[1], 6.5 + (k % 3), 12 + ((k * 37) % 11) * 4.5, k);
        });
      }
    }
    for (var i = 0; i < 70; i++) {
      var a = i / 70 * Math.PI * 2 + Math.sin(i * 3.7) * 0.04, r = radius + 14 + (i * 37 % 5) * 9;
      var w = 7 + (i * 13 % 6), h = 22 + (i * 29 % 9) * 9, m = towerMats[i % towerMats.length];
      var t = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), [m, m, roofMat, roofMat, m, m]);
      t.position.set(Math.sin(a) * r, h / 2 - 0.4, Math.cos(a) * r); t.rotation.y = a; towers.add(t);
      if (h > 70) towers.add(mesh(new THREE.SphereGeometry(0.6, 8, 6), beaconMat, t.position.x, h + 0.2, t.position.z));
    }
  }

  // ---------- Une île ----------
  // Repères de l'île (le devant regarde la caméra, vers +z) : la maison au fond à gauche, l'écran d'analyse au fond
  // à droite, le marché à droite, le panier (ses caisses = ses positions) à gauche, son coffre de pièces près de la maison.
  var SPOT = {
    home: new THREE.Vector3(-3.9, 0, -2.2), screen: new THREE.Vector3(3.3, 0, -2.2), stall: new THREE.Vector3(2.5, 0, 2.3),
    shelf: new THREE.Vector3(-2.5, 0, 2.3), center: new THREE.Vector3(0, 0, 0.6)
  };
  var FACE = { home: Math.PI, screen: Math.PI, stall: Math.PI / 2, shelf: -Math.PI / 2 };
  var ISLAND = 8.4, SPACING = 24;
  var poleMat = mat(0x262B36, { metalness: 0.4 }), bulbMat = new THREE.MeshBasicMaterial({ color: 0xFFD9A0 });
  var planterMat = mat(0x2A2F3A), bushMat = mat(0x24443A);
  var poolMat = new THREE.MeshBasicMaterial({ color: 0xFFB547, transparent: true, opacity: 0.16, depthWrite: false, blending: THREE.AdditiveBlending }); // flaque de lumière sous les lampadaires
  var sphere = new THREE.SphereGeometry(1, 18, 14), crateGeo = new THREE.BoxGeometry(0.8, 0.62, 0.8);

  function buildHome(id, g) { // la maison de chaque personnalité (reprise de l'île d'origine)
    if (id === 'flan') {
      g.add(mesh(new THREE.BoxGeometry(2.2, 1.5, 1.8), mat(0xFFF3D6), 0, 0.75, 0));
      var roof = mesh(new THREE.ConeGeometry(1.75, 1.0, 4), mat(0xE2B84A), 0, 2.0, 0); roof.rotation.y = Math.PI / 4; g.add(roof);
      g.add(mesh(new THREE.BoxGeometry(0.6, 0.9, 0.05), mat(0xC88A3E), 0, 0.45, 0.92));
    } else if (id === 'mochi') {
      g.add(mesh(new THREE.BoxGeometry(2.0, 1.4, 1.6), mat(0xF4EAFA), 0, 0.7, 0));
      g.add(mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.4, 8), mat(0x8E8AA3), 1.2, 1.2, 0));
      var fl = mesh(new THREE.BoxGeometry(0.7, 0.45, 0.04), mat(0x5B47C2), 1.55, 2.1, 0); g.add(fl);
      g.add(mesh(new THREE.BoxGeometry(2.3, 0.2, 1.9), mat(0xB79BD0), 0, 1.5, 0));
    } else if (id === 'dumpling') {
      g.add(mesh(new THREE.CylinderGeometry(1.1, 1.2, 1.5, 20), mat(0xE6F8F6), 0, 0.75, 0));

    var a = z.actor;
    if (e.kind === 'trade' && e.side === 'buy') {
      return [
        walk('screen'), pause(replay ? 1.6 : 2.6, { status: ['🔍', 'Analyse ' + short(t), time], lens: true, ticker: t, say: pre + (e.why || "J'ai repéré " + short(t) + '.') }),

        walk('shelf'), pause(0.8, { take: t, carry: t, done: function () { if (t) z.pendSell[t] = Math.max(0, (z.pendSell[t] || 1) - 1); } }),
        walk('stall'), pause(1.4, { status: ['💰', 'Vend ' + (e.qty || '') + ' ' + short(t), time], coins: 'earn', drop: null, say: stop ? null : pre + line, sayKind: 'trade', sfx: stop ? 'oops' : 'coin', uncarry: true }),

  // Quand il n'a rien à faire : il refait ce qu'il a vraiment en tête (seuils, stops, watchlist, intention).
  function idleSteps(z) {

  }

  // Les caisses du panier : ses positions, moins celles qu'il n'a pas encore rangées, plus celles qu'il n'a pas encore vendues.
  function refreshCrates(z) {
    var l = liveById[z.id] || {}, held = l.holdings || {}, want = {};
    Object.keys(held).forEach(function (t) { if (!z.pendBuy[t]) want[t] = held[t]; });
    Object.keys(z.pendSell).forEach(function (t) { if (z.pendSell[t] > 0) want[t] = held[t] != null ? held[t] : null; });
    if (z.step && z.step.take && z.step.left > 0) delete want[z.step.take]; // il l'a dans les bras

    Object.keys(want).sort().forEach(function (t, i) {

  // ---------- Les vues : mosaïque, une île, l'archipel ----------

  function setMode(m) {

  // Glisser pour tourner, molette / pincement pour zoomer, double-clic pour recentrer ; clic sur un Chubby dans l'archipel.
  (function () {
    var st = $('#stage'), pts = {}, last = null, pinch = null, moved = 0;
    st.addEventListener('pointerdown', function (e) { if (e.target.closest('.btn')) return; st.setPointerCapture(e.pointerId); pts[e.pointerId] = { x: e.clientX, y: e.clientY }; last = { x: e.clientX, y: e.clientY }; moved = 0; st.style.cursor = 'grabbing'; });

  // Dès qu'un ordre arrive, ses caisses sont réservées : un achat n'apparaît dans le panier qu'une fois rangé,

    else if (t && (e.kind === 'trade' || e.kind === 'stop')) z.pendSell[t] = (z.pendSell[t] || 0) + 1;
    z.queue.push({ e: e, replay: replay });
    if (z.idle && z.step) { endStep(z, z.step); z.step = null; z.steps = []; } // un vrai ordre passe avant ses petites habitudes
  }
  function applyActivity(act, first) {
    if (!act) return;
    (act.events || []).forEach(function (e) {
      if (!e.bot_id) return;
      var z = byId[e.bot_id]; if (!z) return;
      if (z.journal.some(function (x) { return x.id === e.id; })) return;
      z.journal.push(e);
      if (first) return;
      enqueue(z, e, false);
      if (e.kind === 'trade' || e.kind === 'stop') toast(z.name, eventLine(e));
    });
    if (first) { // à l'ouverture de la page, chacun rejoue en accéléré ce qu'il a fait aujourd'hui (les 6 derniers gestes)
      zones.forEach(function (z) {
        z.journal.filter(function (e) { return e.kind !== 'analyse' || e.ticker; }).slice(-6).forEach(function (e) { enqueue(z, e, true); });
        refreshCrates(z);
      });
    }
    lastEventId = act.last_id;
    renderSide();
  }
  function getJSON(url) { return fetch(url).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); }
  function pollLive() { if (!document.hidden) getJSON('/api/live').then(applyLive); }
  function pollActivity() {
    if (document.hidden || lastEventId == null) return;
    getJSON('/api/activity?since=' + lastEventId).then(function (a) { applyActivity(a, false); });
  }

  // ---------- Son ----------
  function setSoundBtn(on) { var b = $('#b-sound'); b.setAttribute('aria-pressed', String(on)); b.textContent = on ? '🔊 Son' : '🔇 Son'; }
  if (S) {
    $('#s-voice').value = S.voice || 'mignonne';
    if (!S.humanAvailable()) $('#s-voice').querySelector('[value=humaine]').disabled = true;
    $('#b-sound').onclick = function () { setSoundBtn(S.setSound(!S.sound)); };
    $('#s-voice').onchange = function () { S.setVoice(this.value); if (!S.sound) setSoundBtn(S.setSound(true)); if (current) say(current, 'Coucou, c’est ma voix !'); };
    $('#b-music').onclick = function () { this.setAttribute('aria-pressed', String(S.setMusic(!S.music))); };
  }

  // ---------- Boucle ----------
  var tmp = new THREE.Vector3(), clock = new THREE.Clock(), uiTimer = 0;
  function animateActor(z, dt, t) {
    var a = z.actor, l = liveById[z.id] || {}, mood = l.mood || 'calme';
    if (a.hop >= 0) { a.hop += dt * 2.2; if (a.hop >= 1) a.hop = -1; }
    var hopY = a.hop >= 0 ? Math.sin(Math.PI * a.hop) * 0.7 : 0, walking = z.step && z.step.go;
    var bob = reduceMotion ? 0 : walking ? Math.abs(Math.sin(t * 10 + z.center.x)) * 0.12 : 0;
    var breathe = reduceMotion ? 0 : Math.sin(t * (a.sleeping ? 1.4 : 2.6) + z.center.x) * (a.sleeping ? 0.05 : 0.03);
    a.group.position.y = hopY + bob;
    a.body.scale.set(1 - breathe * 0.5, a.sy * (1 + breathe), 1 - breathe * 0.5);
    var face = a.facing, cur = a.group.rotation.y;
    if (!walking && z.step && z.step.wait && !z.step.lens && !z.step.look && face == null) face = 0;
    if (face != null) { var diff = Math.atan2(Math.sin(face - cur), Math.cos(face - cur)); a.group.rotation.y = cur + diff * Math.min(1, dt * 7); }
    if (!walking && !(z.step && (z.step.lens || z.step.look))) a.facing = 0; // il se tourne vers nous quand il parle ou attend
    a.eyes.forEach(function (e) { e.scale.y = a.sleeping ? 0.15 : 1; });
    var worried = (mood === 'inquiet' || a.sweat.forced) && !a.sleeping;
    a.mouth.rotation.z = worried ? 0 : Math.PI; a.mouth.position.y = worried ? 0.68 : 0.76;
    if (a.talk > 0) { a.talk -= dt; a.mouth.scale.set(1.1, 0.5 + Math.abs(Math.sin(t * 19)) * 1.4, 1); } else a.mouth.scale.setScalar(mood === 'calme' || a.sleeping ? 0.7 : 1);
    a.sweat.visible = worried; if (worried) a.sweat.position.y = 1.35 - ((t * 0.6) % 1) * 0.35;
    a.zzz.visible = !!a.sleeping; if (a.sleeping) a.zzz.position.y = 2.0 + Math.sin(t * 1.5) * 0.12;
    if (a.lens.visible) a.lens.rotation.z = Math.sin(t * 3) * 0.15;
    if (a.carry.visible) a.carry.position.y = 1.95 * a.sy + Math.sin(t * 8) * 0.03;
  }
  function placeBubble(z, cam, rect, el, big) {
    var s = z.say;
    if (!s || performance.now() > s.until) { if (!el.hidden) el.hidden = true; return; }
    tmp.copy(z.actor.group.position); tmp.y += 2.6 * CHUBBY; tmp.project(cam);
    if (el.textContent !== s.text) { el.textContent = s.text; }
    el.className = 'bubble' + (big ? ' big' : '') + (s.kind === 'trade' ? ' trade' : '');
    el.hidden = false;
    var x = (tmp.x * 0.5 + 0.5) * rect.width, y = (-tmp.y * 0.5 + 0.5) * rect.height;
    x = clamp(x - 14, 8, rect.width - el.offsetWidth - 8); y = clamp(y - el.offsetHeight, 46, rect.height - el.offsetHeight - 50);
    el.style.transform = 'translate(' + x.toFixed(0) + 'px,' + y.toFixed(0) + 'px)';
  }
  var stageBubble = document.createElement('div'); stageBubble.className = 'bubble big'; stageBubble.hidden = true; $('#stage').appendChild(stageBubble);

  function frame() {
    requestAnimationFrame(frame);
    var real = Math.min(clock.getDelta(), 0.25), dt = Math.min(real, 0.05), t = clock.elapsedTime;
    seaMat.uniforms.time.value = t;
    // Même si l'ordinateur rame, les Chubbies avancent au rythme de la vraie horloge (par petits pas).
    zones.forEach(function (z) { if (!z.actor || !z.group.visible) return; if (ready) for (var left = real; left > 0; left -= 0.05) runSteps(z, Math.min(left, 0.05)); animateActor(z, dt, t); });
    flying.forEach(function (f) {
      if (!f.on) return; f.t += dt * 1.4; if (f.t < 0) return;
      if (f.t >= 1) { f.on = false; f.t = -1; f.m.visible = false; return; }
      f.m.visible = true; f.m.position.lerpVectors(f.a, f.b, f.t); f.m.position.y += Math.sin(Math.PI * f.t) * 2.2; f.m.rotation.x += dt * 9;
    });
    sparks.forEach(function (s) { if (s.life <= 0) return; s.v.y -= 7 * dt; s.m.position.addScaledVector(s.v, dt); s.life -= dt * 1.2; s.m.scale.setScalar(Math.max(s.life, 0.01)); if (s.life <= 0) s.m.visible = false; });
    uiTimer -= dt; if (uiTimer <= 0) { uiTimer = 0.4; refreshTiles(); }
    sideTimer -= dt; if (sideTimer <= 0 && mode !== 'mosaic') { sideTimer = 1; var n = $('#side-now'); if (n && current) n.innerHTML = esc(current.status || '') + (current.say && performance.now() < current.say.until ? '<br><span style="font-weight:700">« ' + esc(current.say.text) + ' »</span>' : ''); }

    var W = canvas.clientWidth, H = canvas.clientHeight;
    if (canvas.width !== Math.floor(W * renderer.getPixelRatio()) || canvas.height !== Math.floor(H * renderer.getPixelRatio())) renderer.setSize(W, H, false);
    renderer.setScissorTest(false); renderer.clear(); renderer.setScissorTest(true);
    function draw(rect, cam) {
      if (rect.bottom < 0 || rect.top > H || rect.width < 2 || rect.height < 2) return false;
      var y = H - rect.bottom;
      renderer.setViewport(rect.left, y, rect.width, rect.height); renderer.setScissor(rect.left, y, rect.width, rect.height);
      cam.aspect = rect.width / rect.height; cam.updateProjectionMatrix(); renderer.render(scene, cam); return true;
    }
    if (mode === 'mosaic') {
      visibleZones().forEach(function (z) {
        if (!z.tile) return;
        var r = z.tile.getBoundingClientRect();
        if (draw(r, z.cam)) placeBubble(z, z.cam, r, z.tileEls.bubble, false);
      });
    } else {
      if (current) { tmp.copy(current.actor.group.position); orbit.want.copy(current.center).lerp(tmp, 0.35).setY(0.6); }
      orbit.target.lerp(orbit.want, Math.min(1, dt * 2.5));
      if (orbit.touched > 0) orbit.touched -= dt; else if (mode === 'world' && !reduceMotion) orbit.az += dt * 0.03;
      var cam = orbit.cam, ce = Math.cos(orbit.el);
      cam.position.set(orbit.target.x + Math.sin(orbit.az) * ce * orbit.r, orbit.target.y + Math.sin(orbit.el) * orbit.r, orbit.target.z + Math.cos(orbit.az) * ce * orbit.r);
      cam.lookAt(orbit.target);
      var r2 = $('#stage').getBoundingClientRect();
      if (draw(r2, cam) && current) placeBubble(current, cam, r2, stageBubble, true); else stageBubble.hidden = true;
    }
  }

  // ---------- Départ ----------
  getJSON('/api/overview').then(function (ov) {
    (ov && ov.leaderboard || []).forEach(function (b) { ensureZone(b); });
    return getJSON('/api/live');
  }).then(function (lv) {
    if (lv && lv.ok) lv.bots.forEach(function (e) { ensureZone(e); });
    if (!zones.length) { message('Aucun Chubby dans cette base pour l’instant. Lance l’arène (chubby serve) puis reviens ici.'); return; }
    layout();
    if (lv && lv.ok) applyLive(lv); else $('#status').textContent = (lv && lv.error) || 'Pas encore de séance en direct.';
    return getJSON('/api/activity').then(function (a) { applyActivity(a, true); ready = true; });
  }).then(function () {
    var want = decodeURIComponent(location.hash.slice(1));
    if (want && byId[want]) openFocus(byId[want]);
    window.addEventListener('hashchange', function () { var id = decodeURIComponent(location.hash.slice(1)); if (id && byId[id] && current !== byId[id]) openFocus(byId[id]); });
    setInterval(pollLive, 60000);
    setInterval(pollActivity, 15000);
  });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
