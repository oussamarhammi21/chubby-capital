[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chubby-capital"
version = "0.1.0"
description = "Arène de bots de trading en argent fictif (Canada + États-Unis)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chubby = "chubby.cli:main"

[tool.setuptools.packages.find]
include = ["chubby*"]

[tool.setuptools.package-data]
"chubby.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
